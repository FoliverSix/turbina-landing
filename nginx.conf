server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache — icones de marca tem nome fixo, entao TTL curto: quando a marca muda,
    # o edge do Cloudflare revalida sozinho em 1h (sem purge manual no painel).
    location ~* ^/(favicon\.ico|favicon-[0-9]+\.png|apple-touch-icon\.png)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Demais imagens (og-image etc) podem cachear longo
    location ~* \.(ico|png)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.(css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        expires 0;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SEO
    location = /sitemap.xml {
        types { } default_type application/xml;
        expires 1h;
    }

    location = /robots.txt {
        types { } default_type text/plain;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Segurança
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
